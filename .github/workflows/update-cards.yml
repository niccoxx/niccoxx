name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"   # ogni giorno alle 03:17 UTC
  workflow_dispatch:       # avvio manuale dalla tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&locale=it
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=tokyonight&hide_border=true&locale=it
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats card (EN)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&locale=en
          path: profile/stats-en.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (EN)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=tokyonight&hide_border=true&locale=en
          path: profile/top-langs-en.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          # ritenta il push in caso di errori temporanei lato GitHub
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push fallito (tentativo $i), riprovo tra $((i * 10))s..."
            sleep $((i * 10))
            git pull --rebase
          done
          exit 1
